# ==============================================================================
# aaPanel Supervisor Manager Configuration for: techmarket.com.bd
# Place in: aaPanel > App Store > Supervisor Manager > Add Daemon
# ==============================================================================

[program:techmarket-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/techmarket.com.bd/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
user=www
numprocs=2
redirect_stderr=true
stdout_logfile=/www/wwwroot/techmarket.com.bd/storage/logs/worker.log
stopwaitsecs=3600
