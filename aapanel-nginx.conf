# ==============================================================================
# aaPanel Nginx Production Configuration for: techmarket.com.bd
# Website Path: /www/wwwroot/techmarket.com.bd/public
# ==============================================================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name techmarket.com.bd www.techmarket.com.bd;
    
    # 1. Root Directory MUST point to Laravel /public
    root /www/wwwroot/techmarket.com.bd/public;
    index index.php index.html index.htm;

    # 2. Upload file size limit for high-res product hardware images
    client_max_body_size 64M;
    client_body_buffer_size 128k;

    # 3. SSL Configuration (Managed by aaPanel Let's Encrypt)
    # ssl_certificate    /www/server/panel/vhost/cert/techmarket.com.bd/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/techmarket.com.bd/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;

    # 4. Gzip Compression for Fast Page Loads & Core Web Vitals
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # 5. Security & Isolation Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 6. Main Laravel Router (URL Rewrite)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 7. FastCGI PHP-FPM Configuration
    # (Matches aaPanel PHP 8.2 socket. If using PHP 8.3, change to php-cgi-83.sock)
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Buffer & Timeout settings for report generation and exports
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 300;
    }

    # 8. Hashed Vite Assets Caching (1 Year Immutable Cache)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        log_not_found off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 9. Dynamic Sitemaps, Feeds & Robots
    location ~* (sitemap\.xml|robots\.txt|feeds/.*) {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri /index.php?$query_string;
    }

    # 10. Block Access to Hidden & Sensitive System Files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(?:\.env|\.git|\.editorconfig|composer\.(?:json|lock)|package\.(?:json|lock)|vite\.config\.js|tailwind\.config\.js) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 11. Custom Domain Error & Access Logs
    access_log /www/wwwlogs/techmarket.com.bd.log;
    error_log /www/wwwlogs/techmarket.com.bd.error.log ^error;
}
